<!-- SpaceStation "Planets" mark (in-page logo): three Julia-family spheres — radial gradient,
     highlight top-left, shadowed rim — with a blue twinkle. Same three-dot layout the Julia
     ecosystem shares, but lit as celestial bodies rather than flat fills, so it's distinctly
     ours (and no longer Pluto's exact tinted circles). Kept in sync with favicon.svg. -->
