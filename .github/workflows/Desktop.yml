# The desktop shell, tested and packaged across macOS / Windows / Linux.
#
# test: two smokes, because one of them used to be the whole story and that is how issue #55 shipped.
#   - headless (desktop/smoke.ts), every OS: finds Julia, starts the SpaceStation server, waits for
#     /ping, reads the connection-file secret, fetches the authenticated hub, checks desktop mode,
#     shuts down cleanly. It covers everything EXCEPT the window.
#   - headed (desktop/window_smoke.ts), macOS + Windows: opens a REAL window and makes the webview
#     prove it rendered by fetching a beacon URL. The window layer had never once been executed in
#     CI, which is why "the app opens nothing on Windows" stayed green all the way to a release.
#     Linux is deliberately not in this one: the runner has no display or WebKitGTK stack, and a
#     check that is allowed to fail is exactly how #55 stayed invisible.
# build: packages the per-OS installers (.dmg for both Mac architectures, .msi, .AppImage) with
#   juliaup's portable build vendored inside (no Julia required on the target machine); uploads
#   them as CI artifacts, and on a published release attaches them to the release and appends the
#   install guide (incl. the unsigned-build workarounds) to the release notes.
#   macOS signing + notarization activate when the repo has the signing secrets (see
#   desktop/README.md); bundles ship ad-hoc-signed otherwise.
#   On Windows it then INSTALLS the .msi it just built and launches the installed app — nothing did
#   that before #55, so a build that could not open a window shipped as a release asset. That step
#   revokes its own write access to Program Files first; see the comment there for why.

name: Desktop

on:
  push:
    branches: [main, feat/deno-desktop]
    paths: ["desktop/**", ".github/workflows/Desktop.yml", "src/**", "frontend/**", "Project.toml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/Desktop.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach installers + install guide to this existing release (e.g. v0.4.0). The ReleasePlease workflow dispatches this automatically — releases it creates with GITHUB_TOKEN cannot trigger the `release` event."
        required: false
        type: string
        default: ""


permissions:
  contents: write # attach installers + edit notes on releases; read-only for everything else we do

concurrency:
  # Release builds get their OWN lane: they are dispatched from ReleasePlease at the same moment
  # the release commit lands on main, and sharing a group with the ordinary push build meant one
  # cancelled the other (v0.4.0's installer backfill died exactly this way).
  group: desktop-${{ github.ref }}-${{ inputs.release_tag || 'ci' }}
  cancel-in-progress: true

jobs:
  test:
    name: smoke · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Instantiate the Julia project
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'
      - name: Typecheck the shell
        working-directory: desktop
        run: deno check main.ts boot.ts splash.ts deck.ts launch.ts julia.ts theme.ts macos_titlebar.ts smoke.ts webview2.ts window_smoke.ts
      - name: Headless smoke test (boots the full stack)
        working-directory: desktop
        env:
          # setup-julia installs plain julia (no juliaup); the smoke finds it on PATH
          SPACESTATION_PROJECT: ${{ github.workspace }}
        run: deno task smoke

      # The two steps below are the coverage whose absence let #55 ship: they open a REAL window.
      - name: Headed window smoke · macOS
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -euo pipefail
          rm -rf dist/WindowSmoke*
          deno desktop -o dist/WindowSmoke --allow-net --allow-env --allow-read --allow-write window_smoke.ts
          # Locate the bundle rather than assuming its name: deno appends `.app` itself, so naming
          # the output `WindowSmoke.app` yields `WindowSmoke.app.app` on some versions.
          app=$(find dist -maxdepth 1 -name "*.app" | head -1)
          [ -n "$app" ] || { echo "no .app produced"; ls -la dist; exit 1; }
          # `deno desktop <script>` builds a GUI bundle and does not stream its output, so run the
          # built binary directly — that inherits stdout and, more importantly, the exit code.
          "$app/Contents/MacOS/laufey_webview"

      - name: Headed window smoke · Windows
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = "$env:RUNNER_TEMP\window-smoke.log"
          $env:SPACESTATION_SMOKE_LOG = $log
          # --icon is required, and not cosmetically: deno decodes desktop.app.icons.macos (.icns)
          # even when the target is Windows and fails the build outright. Overriding with the .ico
          # sidesteps that. (deno 2.9.5 embeds neither, but it still insists on decoding them.)
          Remove-Item -Recurse -Force dist\WindowSmoke* -ErrorAction SilentlyContinue
          deno desktop --icon icons/spacestation.ico -o dist/WindowSmoke.exe --allow-net --allow-env --allow-read --allow-write window_smoke.ts
          # Locate the exe rather than assuming the layout: a native build drops dist\WindowSmoke.exe
          # while a cross-compiled one nests it in dist\WindowSmoke\.
          $exe = (Get-ChildItem -Path dist -Recurse -Filter "WindowSmoke*.exe" | Select-Object -First 1).FullName
          if (-not $exe) { Get-ChildItem -Recurse dist | Select-Object FullName; throw "the smoke build produced no executable under dist" }
          Write-Host "running $exe"
          # Start via .NET rather than Start-Process: `Start-Process -Wait -PassThru` fails on a
          # GUI-subsystem binary with "the system cannot find all the information required", and
          # redirecting the streams here captures output a GUI process would otherwise send nowhere.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          $stdout = $proc.StandardOutput.ReadToEnd()
          $stderr = $proc.StandardError.ReadToEnd()
          $proc.WaitForExit()
          if ($stdout) { Write-Host $stdout }
          if ($stderr) { Write-Host $stderr }
          # SPACESTATION_SMOKE_LOG is the belt-and-braces copy, in case the streams stay empty.
          if (Test-Path $log) { Write-Host "--- smoke log ---"; Get-Content $log }
          if ($proc.ExitCode -ne 0) { throw "the window smoke failed (exit code $($proc.ExitCode))" }

  build:
    name: bundle · ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # `built` is what the build produces — always the clean product name, because the
          # bundle inside inherits it (an .app named SpaceStation-mac-arm64 would install into
          # /Applications under that name). `file` is the platform-suffixed release asset.
          - { name: mac-arm64, os: macos-14, task: "build:dmg", built: SpaceStation.dmg, file: SpaceStation-mac-arm64.dmg }
          - { name: mac-x64, os: macos-15-intel, task: "build:dmg-intel", built: SpaceStation.dmg, file: SpaceStation-mac-x64.dmg }
          - { name: windows-x64, os: windows-latest, task: "build:msi", built: SpaceStation.msi, file: SpaceStation-win-x64.msi }
          - { name: linux-x64, os: ubuntu-latest, task: "build:linux", built: SpaceStation.AppImage, file: SpaceStation-linux-x64.AppImage }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # secrets are not readable in `if:` conditions directly — surface them as env first;
      # absent secrets leave these empty and the signing steps skip (ad-hoc-signed bundles)
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p ci $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p ci $KEYCHAIN
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci $KEYCHAIN
          rm cert.p12
      - name: Build installer
        working-directory: desktop
        run: deno task ${{ matrix.task }}
      # Without this every release ships the same installer identity (ProductVersion 1.0.0, a
      # ProductCode fixed by the app id, no Upgrade table), so Windows treats a newer .msi as the
      # version already installed and drops into maintenance mode instead of upgrading. Users could
      # not get the #55 fix by downloading the fixed installer. See desktop/stamp_msi.ps1.
      - name: Stamp the installer with a real version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.event.release.tag_name }}${{ inputs.release_tag }}"
          $version = if ($tag) { $tag } else { (Select-String -Path ../Project.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value }
          pwsh -File stamp_msi.ps1 -Msi "dist/${{ matrix.built }}" -Version $version

      - name: Name the release asset
        shell: bash
        working-directory: desktop
        run: mv "dist/${{ matrix.built }}" "dist/${{ matrix.file }}"
      # The regression test for issue #55: install the .msi we just built to its REAL destination and
      # launch the installed app. Before this, the MSI was built, uploaded and attached to releases
      # without anything ever running it — so a build whose window could never open shipped.
      - name: Install the MSI and launch it (regression test for #55)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          $msi = (Resolve-Path "dist/${{ matrix.file }}").Path
          $log = "$env:RUNNER_TEMP\msi-install.log"
          Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/l*v","`"$log`"" -Wait
          $dir = "C:\Program Files\SpaceStation"
          $exe = Join-Path $dir "SpaceStation.exe"
          if (-not (Test-Path $exe)) {
              if (Test-Path $log) { Get-Content $log -Tail 60 }
              throw "the MSI did not install $exe"
          }
          Write-Host "installed to $exe"

          # GitHub's Windows runners run as administrators with UAC disabled, so Program Files is
          # writable for THIS account — meaning #55 would not reproduce here on its own and a naive
          # install-and-launch test would go green against the very bug it exists to catch. Revoke
          # our own write access first, so the launch below meets what a normal user meets.
          icacls $dir /deny "$($env:USERNAME):(OI)(CI)(W)" /T /C | Out-Null

          $profileRoot = Join-Path $env:LOCALAPPDATA "SpaceStation\WebView2"
          $profileDir = Join-Path $profileRoot "EBWebView"
          Remove-Item -Recurse -Force $profileRoot -ErrorAction SilentlyContinue

          $ok = $true
          # .NET rather than Start-Process, for the same reason as the headed smoke above:
          # Start-Process is unreliable against a GUI-subsystem binary.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $profileDir)) {
              if ($p.HasExited) { break }
              Start-Sleep -Seconds 3
          }

          # WebView2 only materializes a profile once its environment is really created there, so
          # this directory existing is proof the webview came up — and proof of WHERE it came up.
          if (-not (Test-Path $profileDir)) {
              Write-Host "::error::WebView2 never initialized: nothing at $profileDir after 180s. The app is running with no window — this is issue #55."
              $ok = $false
          } else {
              Write-Host "WebView2 initialized at $profileDir"
          }
          if (Test-Path "$exe.WebView2") {
              Write-Host "::error::WebView2 fell back to $exe.WebView2 — beside the binary, in a directory a normal user cannot write. This is issue #55."
              $ok = $false
          }
          if ($p.HasExited -and $ok) {
              Write-Host "::error::the installed app exited on its own (code $($p.ExitCode)) instead of staying up."
              $ok = $false
          }

          # Leave the runner as we found it whether or not the assertions passed.
          if (-not $p.HasExited) { try { $p.Kill() } catch { } }
          icacls $dir /remove:d "$env:USERNAME" /T /C | Out-Null
          Start-Process msiexec -ArgumentList "/x","`"$msi`"","/qn" -Wait

          if (-not $ok) { throw "the installed Windows app failed the #55 regression test" }
          Write-Host "the installed app opened its webview from a writable profile directory"

      # An installer users cannot upgrade to is a fix they never receive. Build a higher-versioned
      # copy of the same package and prove a plain `msiexec /i` REPLACES the installed one rather
      # than landing beside it or bouncing into maintenance mode.
      - name: Prove the installer upgrades in place (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          $old = (Resolve-Path "dist/${{ matrix.file }}").Path
          $new = Join-Path $env:RUNNER_TEMP "SpaceStation-upgrade-test.msi"
          Copy-Item $old $new -Force
          pwsh -File stamp_msi.ps1 -Msi $new -Version "99.0.0"

          $installed = { (Get-CimInstance Win32_Product -Filter "Name='SpaceStation'" | Measure-Object).Count }
          Start-Process msiexec -ArgumentList "/i","`"$old`"","/qn" -Wait
          $before = & $installed
          Write-Host "after installing the release build: $before entry/entries"

          Start-Process msiexec -ArgumentList "/i","`"$new`"","/qn","/l*v","`"$env:RUNNER_TEMP\upgrade.log`"" -Wait
          $after = & $installed
          $version = (Get-CimInstance Win32_Product -Filter "Name='SpaceStation'" | Select-Object -First 1).Version
          Write-Host "after installing the newer build: $after entry/entries, version $version"

          $ok = $true
          if ($after -ne 1) {
              Write-Host "::error::expected exactly one SpaceStation entry after the upgrade, found $after — the new build installed alongside the old one instead of replacing it."
              $ok = $false
          }
          if ($version -ne "99.0.0") {
              Write-Host "::error::the installed version is $version, not the 99.0.0 we just installed — Windows treated the newer package as already-installed and skipped it."
              $ok = $false
          }
          Start-Process msiexec -ArgumentList "/x","`"$new`"","/qn" -Wait
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\upgrade.log" -Tail 40; throw "the Windows installer cannot upgrade in place" }
          Write-Host "a newer .msi cleanly replaces the installed one"

      - name: Sign + notarize (macOS, when credentials exist)
        # NOTE: signing a finished .dmg requires the .app INSIDE to be signed at build time —
        # once enrolled, set desktop.macos.codesignIdentity in deno.json so `deno desktop` signs
        # during the build, then this step notarizes + staples the .dmg itself.
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        working-directory: desktop
        run: |
          codesign --force --options runtime --timestamp -s "$MACOS_SIGN_IDENTITY" "dist/${{ matrix.file }}"
          xcrun notarytool submit "dist/${{ matrix.file }}" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: desktop/dist/${{ matrix.file }}
          if-no-files-found: error
      - name: Attach to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: desktop
        run: gh release upload "${{ github.event.release.tag_name || inputs.release_tag }}" "dist/${{ matrix.file }}" --clobber

  # Release notes get the install guide appended (once): download table + the one-time
  # unsigned-build workarounds, until signing credentials exist.
  release-notes:
    name: release install guide
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Append install guide to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # Drop any guide appended by an earlier run so this job UPDATES in place rather than
          # skipping — otherwise wording fixes never reach releases that already have one.
          awk '/^## Install the desktop app$/{exit} {print}' notes.md > trimmed.md
          mv trimmed.md notes.md
          cat >> notes.md <<'EOF'

          ## Install the desktop app

          No Julia needed — the app installs one for you (bundled juliaup), or uses whichever
          Julia versions you already have.

          | Platform | Download |
          |----------|----------|
          | macOS (Apple Silicon) | `SpaceStation-mac-arm64.dmg` |
          | macOS (Intel) | `SpaceStation-mac-x64.dmg` |
          | Windows | `SpaceStation-win-x64.msi` |
          | Linux | `SpaceStation-linux-x64.AppImage` |

          ### First launch — one time only

          These builds are **not code-signed yet**, so each OS asks once before it will run a new
          app. Nothing here is permanent; it is the same step you take for any unsigned download.

          **macOS** — open the `.dmg` and drag **SpaceStation** into **Applications** (do not run it
          from the disk image). Then paste both lines into Terminal:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/SpaceStation.app"
          codesign --force --deep --sign - "/Applications/SpaceStation.app"
          ```

          Then open SpaceStation normally. The first line clears the download quarantine; the second
          re-signs the app locally, which is what clears *"SpaceStation is damaged and can't be
          opened"* — macOS shows that wording for any app that isn't signed with a paid Developer ID,
          and on Apple Silicon clearing quarantine alone is often not enough. Nothing is actually
          damaged. (No admin rights? Drag it to `~/Applications` instead and use that path in both
          commands.)

          Both steps disappear once the project has an Apple Developer ID and releases are notarized.

          **Windows** — double-click `SpaceStation-win-x64.msi`. If SmartScreen shows *"Windows
          protected your PC"*, click **More info → Run anyway**.

          > **Upgrading?** Just run the new `.msi` — it replaces the installed version in place.
          > (Builds before v0.4.8 all declared the same installer identity, so Windows saw every
          > release as the version it already had and quietly skipped the upgrade. If you are coming
          > from one of those and Windows offers you *Repair / Remove* instead of installing, remove
          > **SpaceStation** from *Settings → Apps → Installed apps* once, then run the `.msi`.)

          **Linux** — mark the AppImage executable and run it:

          ```sh
          chmod +x SpaceStation-linux-x64.AppImage
          ./SpaceStation-linux-x64.AppImage
          ```

          ### Prefer the terminal?

          ```julia
          import Pkg; Pkg.Apps.add(url="https://github.com/GroupTherapyOrg/SpaceStation.jl")
          ```

          That installs the `spacestation` CLI on its own. The desktop app registers the same CLI
          for you and puts it on your `PATH`, so new terminals pick it up either way.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
