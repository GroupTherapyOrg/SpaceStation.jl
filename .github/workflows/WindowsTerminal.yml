name: Windows terminal (ConPTY)

# Exercises the Windows ConPTY PTY layer (src/webserver/PTYWindows.jl) on a real Windows
# runner — the integrated terminal's backend can only be tested here. Standalone, so it
# does not instantiate the whole package: fast to iterate on.

on:
  push:
    branches: [ main, windows-terminal-ci ]
    paths:
      - 'src/webserver/PTYWindows.jl'
      - 'src/webserver/CollabTerminal.jl'
      - 'src/webserver/conpty/**'
      - 'test/conpty_windows.jl'
      - 'test/mouse_probe.jl'
      - '.github/workflows/WindowsTerminal.yml'
  pull_request:
    paths:
      - 'src/webserver/PTYWindows.jl'
      - 'src/webserver/CollabTerminal.jl'
      - 'src/webserver/conpty/**'
      - 'test/conpty_windows.jl'
      - 'test/mouse_probe.jl'
      - '.github/workflows/WindowsTerminal.yml'
  workflow_dispatch:

# A newer push to the same branch or pull request makes the run for the older one pointless, and
# while it sits in the queue it holds the runners the newer one is waiting for. Runs on main are
# left to finish: each of them is the record for a commit that is already there.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conpty:
    # Both: the pseudo-console closes differently before Windows 11 24H2 / Server 2025 (it waits for
    # the console host), and most machines in use are still the older kind.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: ConPTY low-level diagnostic
        run: julia --startup-file=no --color=yes test/conpty_diag.jl
      - name: ConPTY smoke test
        if: always()
        run: julia --startup-file=no --color=yes test/conpty_windows.jl
