name: Test bundled HTML export

on:
    push:
        branches:
            - release

# A newer push to the same branch or pull request makes the run for the older one pointless, and
# while it sits in the queue it holds the runners the newer one is waiting for. Runs on main are
# left to finish: each of them is the record for a commit that is already there.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    frontend-test:
        runs-on: "ubuntu-latest"

        steps:
            - uses: actions/checkout@v7

            - uses: julia-actions/setup-julia@v3
              with:
                  version: "1.10"

            - name: Generate exports and check for warnings
              run: |
                julia --project=$GITHUB_WORKSPACE -e '
                  import Pkg
                  Pkg.activate(".")
                  Pkg.instantiate()
                  import SpaceStation
                  using Test
                  
                  @test_logs SpaceStation.generate_html()
                  @test_logs SpaceStation.generate_html(offline_bundle=true)
                  @test_logs SpaceStation.generate_index_html()
                  '

