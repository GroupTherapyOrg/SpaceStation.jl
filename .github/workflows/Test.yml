name: SpaceStation backend tests

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
    workflow_dispatch:
    push:
        paths-ignore:
            - "frontend/**"
            - "frontend-bundler/**"
            - "frontend-dist/**"
            - "frontend-dist-offline/**"
            - "test/frontend/**"
            - "**.md"
        branches:
            - main
    pull_request:
        paths-ignore:
            - "frontend/**"
            - "frontend-bundler/**"
            - "frontend-dist/**"
            - "frontend-dist-offline/**"
            - "test/frontend/**"
            - "**.md"
        branches-ignore:
            - release

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    test:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 50
        # Unreleased Julia is informational: its stdlib/docsystem changes under us (as the 1.13-DEV
        # docstring change did before 1.13 was released and supported), and a moving target must
        # not block releases of the package itself. (nightly rather than "~1.14.0-0": setup-julia
        # fails outright while no 1.14 prerelease binaries exist — switch once they do.)
        continue-on-error: ${{ matrix.julia-version == 'nightly' }}

        strategy:
            # Without setting this, a failing test cancels all others
            fail-fast: false
            matrix:
                # We test quite a lot of versions because we do some OS and version specific things unfortunately
                julia-version: ["1.10", "1.12", "1.13", "nightly"] # "~1.14.0-0" once prereleases exist
                os: [ubuntu-latest, macOS-latest, windows-latest]
                # By default, resolve HTTP.jl freely — with the HTTP compat entry in Project.toml that
                # gives us the latest 1.x.
                http-version: [""]
                # Also pin the lowest HTTP.jl that the compat entry allows, on the oldest Julia.
                include:
                    - julia-version: "1.10"
                      os: ubuntu-latest
                      http-version: "1.10.19"
                    # HTTP.jl 2 is not enabled in the fork yet (compat is `^1.10.19`): upstream also
                    # pins "2.7.0" here, and "1" on Julia 1.12 for each OS (the default resolve above).
                    # - julia-version: "1.10"
                    #   os: ubuntu-latest
                    #   http-version: "2.7.0"

        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - uses: actions/checkout@v7

            # Makes the `julia` command available
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.julia-version }}
                  arch: ${{ runner.arch }}

            - uses: julia-actions/cache@v3

            - name: Pin HTTP.jl to ${{ matrix.http-version }}
              if: matrix.http-version != ''
              run: julia --project=. -e 'import Pkg; Pkg.add(name="HTTP", version="${{ matrix.http-version }}"); Pkg.pin("HTTP"); Pkg.status("HTTP")'

            # 🚗
            - uses: julia-actions/julia-runtest@v1
              env:
                  # test/webserver.jl asserts that this is the version that actually got loaded
                  PLUTO_TEST_HTTP_VERSION: ${{ matrix.http-version }}
              with:
                  coverage: false

            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: test-snapshots-${{ matrix.julia-version }}-${{ matrix.os }}-http${{ matrix.http-version || 'latest' }}
                  path: ${{ github.workspace }}/test/snapshots/*.html
