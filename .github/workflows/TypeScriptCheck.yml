name: Run TypeScript checks

on:
    push:
        paths:
            - "**.js"
            - "**.ts"
        branches:
            - main
            - release
    pull_request:
        paths:
            - "**.js"
            - "**.ts"
        branches-ignore:
            - release
    workflow_dispatch:

# A newer push to the same branch or pull request makes the run for the older one pointless, and
# while it sits in the queue it holds the runners the newer one is waiting for. Runs on main are
# left to finish: each of them is the record for a commit that is already there.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - run: npm install typescript@5.9.3 -g
      
      - run: npm install
        working-directory: frontend
      
      - name: Run TypeScript checks on frontend/
        run: tsc --noEmit
